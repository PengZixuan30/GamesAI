plugins {
    id 'fabric-loom' version "${loom_version}"
    // id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
minecraft_version = project.minecraft_version

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "games_ai" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

configurations {
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (minecraft_version.split("\\.")[0] == "1") {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }

    if (minecraft_version.split("\\.")[0] != "1") {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        //openai-java
        implementation "com.openai:openai-java:4.43.0"

        //groovy
        implementation "org.apache.groovy:groovy:5.0.7"

        // ModMenu (optional integration)
        compileOnly 'com.terraformersmc:modmenu:[14.0,)'
    } else {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        //openai-java
        modImplementation "com.openai:openai-java:4.43.0"

        //groovy
        modImplementation "org.apache.groovy:groovy:5.0.7"

        //modMenu (optional)
        modClientCompileOnly 'com.terraformersmc:modmenu:[14.0,)'
    }

    // openai-java
    include "com.openai:openai-java-core:4.43.0"
    include "com.openai:openai-java-client-okhttp:4.43.0"

    // Kotlin
    include "org.jetbrains.kotlin:kotlin-stdlib:2.4.10"
    include "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.10"
    include "org.jetbrains.kotlin:kotlin-reflect:2.4.10"

    // Jackson (match openai-java transitive dependency versions)
    include "com.fasterxml.jackson.core:jackson-databind:2.18.2"
    include "com.fasterxml.jackson.core:jackson-core:2.18.2"
    include "com.fasterxml.jackson.core:jackson-annotations:2.18.2"
    include "com.fasterxml.jackson.module:jackson-module-kotlin:2.18.2"
    include "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.2"
    include "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2"

    // OkHttp
    include "com.squareup.okhttp3:okhttp:4.12.0"
    include "com.squareup.okio:okio-jvm:3.9.0"

    // SQLite
    include "org.xerial:sqlite-jdbc:3.45.0.0"

    // Groovy
    include "org.apache.groovy:groovy:5.0.7"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ['-parameters']
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
